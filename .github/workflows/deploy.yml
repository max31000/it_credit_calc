name: Deploy to VDS

# Один workflow: backend (тесты → образ → деплой → health) → frontend (needs: backend).
# Path-фильтр: изменился только фронт — backend пропускается, needs удовлетворён (spec §10.3, addendum E).
# Образы пушатся только как sha-<commit> и запускаются по этому тегу; контейнеры с меткой
# com.centurylinklabs.watchtower.enable=false — watchtower их не трогает.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-credit-calc
  cancel-in-progress: false

env:
  TAG: sha-${{ github.sha }}
  WEB_IMAGE: ghcr.io/max31000/it_credit_calc
  API_IMAGE: ghcr.io/max31000/it_credit_calc-api

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # workflow_dispatch деплоит обе части
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - 'deploy/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'eslint.config.js'
              - 'nginx.conf'
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

  backend:
    name: Backend (test, image, deploy)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore server/CreditCalc.sln

      - name: Build
        run: dotnet build server/CreditCalc.sln -c Release --no-restore

      - name: Test
        run: dotnet test server/CreditCalc.sln -c Release --no-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (sha tag only)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: server/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.TAG }}
          labels: com.centurylinklabs.watchtower.enable=false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Copy compose file to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/credit_calc/"
          strip_components: 1

      - name: Deploy API via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          TAG: ${{ env.TAG }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          port: 22
          envs: GHCR_PAT,MYSQL_ROOT_PASSWORD,MYSQL_PASSWORD,TAG
          script: |
            set -e
            cd /opt/credit_calc
            umask 077
            # Секреты — в .env (только они; файл целиком принадлежит этому job), атомарно.
            printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD" "$MYSQL_PASSWORD" > .env.new
            mv .env.new .env
            # Теги образов — в tags.env: этот job меняет только API_TAG. Если WEB_TAG ещё нет (первый деплой
            # после перехода на sha-теги) — тег работающего web-контейнера, иначе latest.
            touch tags.env
            set_tag() { { grep -v "^$1=" tags.env || true; echo "$1=$2"; } > tags.env.new; mv tags.env.new tags.env; }
            running_tag() { img=$(docker inspect --format '{{.Config.Image}}' "$1" 2>/dev/null || true); case "$img" in *:*) echo "${img##*:}";; *) echo latest;; esac; }
            dc() { docker compose --env-file .env --env-file tags.env -f docker-compose.prod.yml "$@"; }
            grep -q '^WEB_TAG=' tags.env || set_tag WEB_TAG "$(running_tag credit_calc)"
            set_tag API_TAG "$TAG"
            curl_net() { docker run --rm --network cashpulse-network curlimages/curl:8.10.1 -sf --max-time 5 "$@"; }
            echo "${GHCR_PAT}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # credit_calc_api должен видеть mvv42-auth:8080 (JWKS) через внешнюю сеть платформы.
            docker network inspect cashpulse-network >/dev/null
            curl_net http://mvv42-auth:8080/auth/.well-known/jwks.json >/dev/null \
              || { echo "JWKS of mvv42-auth is not reachable from cashpulse-network - refusing to deploy"; exit 1; }
            dc pull credit_calc_api
            # --no-deps: MySQL деплоем не пересоздаётся (см. README «Деплой»).
            dc up -d --no-deps credit_calc_api
            # Health — прямо в API-контейнер (по cashpulse-network), не через nginx фронта.
            # На первом деплое API может перезапуститься на миграциях (restart: unless-stopped) — ретраи.
            ok=0
            for i in $(seq 1 30); do
              if curl_net http://credit_calc_api:8080/health | grep -q '"ok"'; then
                ok=1
                echo "api health ok after ${i} attempt(s)"
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "api health check failed after 150s"
              dc ps
              dc logs --tail=50 credit_calc_api
              exit 1
            fi
            docker image prune -f

  frontend:
    name: Frontend (test, image, deploy)
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.backend.result) && needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (sha tag only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.TAG }}
          labels: com.centurylinklabs.watchtower.enable=false
          build-args: |
            VITE_API_BASE=/credit_calc/api
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Copy compose file to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/credit_calc/"
          strip_components: 1

      - name: Deploy web via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TAG: ${{ env.TAG }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          port: 22
          envs: GHCR_PAT,TAG
          script: |
            set -e
            cd /opt/credit_calc
            umask 077
            # Этот job меняет только WEB_TAG; API_TAG — backend-job (на первом деплое — тег работающего API).
            touch tags.env .env
            set_tag() { { grep -v "^$1=" tags.env || true; echo "$1=$2"; } > tags.env.new; mv tags.env.new tags.env; }
            running_tag() { img=$(docker inspect --format '{{.Config.Image}}' "$1" 2>/dev/null || true); case "$img" in *:*) echo "${img##*:}";; *) echo latest;; esac; }
            dc() { docker compose --env-file .env --env-file tags.env -f docker-compose.prod.yml "$@"; }
            grep -q '^API_TAG=' tags.env || set_tag API_TAG "$(running_tag credit_calc_api)"
            set_tag WEB_TAG "$TAG"
            echo "${GHCR_PAT}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            dc pull credit_calc
            # --no-deps: API деплоит только backend-job, MySQL не трогаем.
            dc up -d --no-deps credit_calc
            ok=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8081/credit_calc/ >/dev/null \
                 && curl -sf http://localhost:8081/credit_calc/api/health | grep -q '"ok"'; then
                ok=1
                echo "health ok after ${i} attempt(s)"
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "health check failed after 150s"
              dc ps
              dc logs --tail=50 credit_calc
              exit 1
            fi
            docker image prune -f

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: failure()
    steps:
      - run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Credit Calc deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
